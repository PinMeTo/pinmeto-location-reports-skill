name: Release Skill Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Package skill
        run: |
          chmod +x package-skill.sh
          ./package-skill.sh

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## PinMeTo Location Reports Skill ${{ steps.get_version.outputs.VERSION }}

            ### Installation

            Download the `.skill` file and install it in Claude Desktop:

            ```bash
            # Download and install
            curl -L -o pinmeto-location-reports.skill https://github.com/PinMeTo/pinmeto-location-reports-skill/releases/download/${{ steps.get_version.outputs.VERSION }}/pinmeto-location-reports.skill
            mkdir -p ~/.claude/skills
            mv pinmeto-location-reports.skill ~/.claude/skills/
            ```

            Or manually download the `.skill` file below and copy it to `~/.claude/skills/`

            ### Requirements
            - Claude Desktop, Claude Code, or Claude.ai
            - [PinMeTo Location MCP](https://github.com/PinMeTo/pinmeto-location-mcp) **4.0.0 or later**, connected to your PinMeTo account

            Earlier major versions of the MCP server use different tool names, parameters, and
            response shapes. This skill's calls will fail or return incorrect data against them.
            To verify a connected server, run the parity check from the skill's `scripts/`
            directory (no credentials required):

            ```bash
            node scripts/check_mcp_parity.js
            ```

            ### Changes

            See [CHANGELOG.md](https://github.com/PinMeTo/pinmeto-location-reports-skill/blob/main/CHANGELOG.md).
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/pinmeto-location-reports.skill
          asset_name: pinmeto-location-reports.skill
          asset_content_type: application/zip
