name: Release Skill Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Package skill
        run: |
          chmod +x package-skill.sh
          ./package-skill.sh

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## PinMeTo Location Reports Skill ${{ steps.get_version.outputs.VERSION }}

            ### Installation

            Download the `.skill` file and install it in Claude Desktop:

            ```bash
            # Download and install
            curl -L -o pinmeto-location-reports.skill https://github.com/PinMeTo/pinmeto-location-reports-skill/releases/download/${{ steps.get_version.outputs.VERSION }}/pinmeto-location-reports.skill
            mkdir -p ~/.claude/skills
            mv pinmeto-location-reports.skill ~/.claude/skills/
            ```

            Or manually download the `.skill` file below and copy it to `~/.claude/skills/`

            ### Requirements
            - Claude Desktop, Claude Code, or Claude.ai
            - [PinMeTo Location MCP](https://github.com/PinMeTo/pinmeto-location-mcp) **4.0.0 or later**, connected to your PinMeTo account

            Earlier major versions of the MCP server use different tool names, parameters, and
            response shapes. This skill's calls will fail or return incorrect data against them.
            To verify a connected server, run the parity check from the skill's `scripts/`
            directory (no credentials required):

            ```bash
            node scripts/check_mcp_parity.js
            ```

            ### Changes

            See [CHANGELOG.md](https://github.com/PinMeTo/pinmeto-location-reports-skill/blob/main/CHANGELOG.md).
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/pinmeto-location-reports.skill
          asset_name: pinmeto-location-reports.skill
          asset_content_type: application/zip

      # The release itself is complete at this point. Notifying the marketplace is
      # a separate concern with a separate credential, so a repo that has not been
      # wired up yet should skip it loudly rather than fail a good release. The
      # secrets context is not available to a step-level `if`, hence the probe step.
      - name: Check whether the marketplace notify is configured
        id: dispatch
        env:
          TOKEN: ${{ secrets.MARKETPLACE_DISPATCH_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          VERSION="${VERSION#v}"
          if [ -n "$TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            # Retry through the marketplace's workflow_dispatch: rerunning this
            # workflow would try to create a release that already exists.
            echo "::warning::MARKETPLACE_DISPATCH_TOKEN is not set, so the marketplace was not notified. The release and its .skill artifact were published normally. To vendor this version, run the 'Sync plugin artifacts' workflow in PinMeTo/agent-plugins with skill_name=pinmeto-location-reports and skill_version=$VERSION, and add the secret so future releases notify automatically."
          fi

      - name: Notify the marketplace to sync
        # Requires a MARKETPLACE_DISPATCH_TOKEN secret: a token allowed to send
        # repository_dispatch to PinMeTo/agent-plugins. The payload names this
        # skill so the marketplace sync vendors the right registry entry.
        if: steps.dispatch.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_DISPATCH_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          VERSION="${VERSION#v}"
          gh api repos/PinMeTo/agent-plugins/dispatches \
            --field event_type=skill-released \
            --field "client_payload[skill_name]=pinmeto-location-reports" \
            --field "client_payload[skill_version]=$VERSION"
